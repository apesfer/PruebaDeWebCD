<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TIME2PLAY</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap">
  <style>
    :root {
      --bg: #0a0c16;
      --p: #121631;
      --p2: #1a1f45;
      --tx: #e8eaf8;
      --mu: #8f94b8;
      --v: #7c5cff;
      --b: #3b82f6;
      --c: #22d3ee;
      --ok: #34d399;
      --bd: rgba(140, 150, 255, .16);
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      scroll-behavior: smooth
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: radial-gradient(900px 500px at 80% -10%, rgba(124, 92, 255, .22), transparent), radial-gradient(700px 400px at -10% 30%, rgba(59, 130, 246, .14), transparent), var(--bg);
      color: var(--tx);
      font: 16px/1.55 "DM Sans", system-ui, sans-serif;
      min-height: 100vh
    }

    h1,
    h2,
    h3,
    .lg {
      font-family: "Space Grotesk", "DM Sans", system-ui, sans-serif;
      letter-spacing: -.02em;
      margin: 0
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 2px solid var(--c);
      outline-offset: 2px
    }

    .w {
      max-width: 1120px;
      margin: auto;
      padding: 0 20px
    }

    .btn {
      border: 1px solid var(--bd);
      background: var(--p);
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: .2s;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      justify-content: center
    }

    .btn:hover {
      border-color: var(--v);
      transform: translateY(-1px)
    }

    .btn.pr {
      background: linear-gradient(135deg, var(--v), var(--b));
      border: 0;
      box-shadow: 0 8px 28px -10px var(--v)
    }

    .btn.sm {
      padding: 6px 12px;
      font-size: 14px;
      border-radius: 9px
    }

    .btn.on {
      background: var(--v);
      border-color: var(--v)
    }

    nav.top {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 20;
      background: rgba(10, 12, 22, .8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--bd)
    }

    nav.top .w {
      display: flex;
      align-items: center;
      gap: 22px;
      height: 64px
    }

    nav.top .l {
      display: flex;
      gap: 20px;
      margin-left: auto;
      color: var(--mu)
    }

    nav.top .l a:hover {
      color: var(--tx)
    }

    .logo {
      font-weight: 700;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .logo i {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: conic-gradient(from 200deg, var(--v), var(--b), var(--c), var(--v));
      display: inline-block
    }

    .hero {
      padding: 70px 0 40px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 40px;
      align-items: center
    }

    .hero h1 {
      font-size: clamp(40px, 6vw, 72px);
      line-height: 1
    }

    .hero p {
      color: var(--mu);
      font-size: 18px;
      max-width: 46ch
    }

    .tag {
      color: var(--c);
      font-weight: 500;
      margin-bottom: 12px
    }

    .card {
      background: linear-gradient(160deg, rgba(26, 31, 69, .7), rgba(18, 22, 49, .7));
      border: 1px solid var(--bd);
      border-radius: 18px;
      padding: 20px;
      transition: .25s
    }

    .card.h:hover {
      border-color: rgba(124, 92, 255, .6);
      transform: translateY(-3px)
    }

    .ribbon {
      padding: 22px
    }

    .ribbon .row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 10px 0
    }

    .ribbon .nm {
      width: 84px;
      font-size: 14px;
      color: var(--mu)
    }

    .bar {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 3px
    }

    .bar b {
      height: 22px;
      border-radius: 5px;
      background: rgba(255, 255, 255, .05)
    }

    .bar b.a {
      background: rgba(59, 130, 246, .55)
    }

    .bar b.z {
      background: rgba(124, 92, 255, .6)
    }

    .bar b.m {
      background: var(--c);
      box-shadow: 0 0 14px rgba(34, 211, 238, .6);
      animation: pl 2.4s ease-in-out infinite
    }

    @keyframes pl {
      50% {
        opacity: .55
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }

      html {
        scroll-behavior: auto
      }
    }

    .sec {
      padding: 60px 0
    }

    .sec h2 {
      font-size: clamp(28px, 4vw, 40px);
      margin-bottom: 28px
    }

    .g3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px
    }

    .g2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px
    }

    .g4 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px
    }

    .av {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-weight: 700;
      flex: none;
      background: hsl(var(--h) 70% 45%);
      position: relative
    }

    .av.on:after {
      content: "";
      position: absolute;
      right: -3px;
      bottom: -3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--ok);
      border: 2px solid var(--p)
    }

    .chip {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      background: rgba(124, 92, 255, .16);
      border: 1px solid rgba(124, 92, 255, .3);
      font-size: 13px;
      margin: 2px 4px 2px 0;
      cursor: default
    }

    button.chip {
      cursor: pointer;
      color: var(--mu)
    }

    button.chip.on {
      background: var(--v);
      color: #fff;
      border-color: var(--v)
    }

    .demo {
      font-size: 12px;
      color: var(--c);
      border: 1px dashed rgba(34, 211, 238, .5);
      border-radius: 6px;
      padding: 0 6px
    }

    .mu {
      color: var(--mu)
    }

    .sm {
      font-size: 14px
    }

    input,
    select,
    textarea {
      background: #0d1022;
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 10px 12px;
      width: 100%
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 14px;
      color: var(--mu)
    }

    .er {
      color: #fb7185;
      font-size: 13px;
      min-height: 18px
    }

    .auth {
      max-width: 440px;
      margin: 50px auto
    }

    .auth .card {
      padding: 28px
    }

    .shell {
      display: grid;
      grid-template-columns: 230px 1fr;
      min-height: 100vh
    }

    aside {
      background: rgba(10, 12, 22, .9);
      border-right: 1px solid var(--bd);
      padding: 18px 12px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto
    }

    aside a {
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--mu);
      margin: 2px 0;
      cursor: pointer
    }

    aside a:hover {
      background: var(--p2);
      color: var(--tx)
    }

    aside a.act {
      background: linear-gradient(90deg, rgba(124, 92, 255, .3), transparent);
      color: #fff;
      box-shadow: inset 2px 0 var(--v)
    }

    main {
      padding: 26px;
      min-width: 0
    }

    main h2 {
      font-size: 28px;
      margin-bottom: 6px
    }

    .pct {
      font-family: "Space Grotesk";
      font-weight: 700;
      font-size: 24px;
      color: var(--c)
    }

    .mb {
      height: 6px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .07);
      overflow: hidden
    }

    .mb i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--v), var(--c))
    }

    .flt {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin: 16px 0
    }

    .grid {
      display: grid;
      grid-template-columns: 42px repeat(7, 1fr);
      gap: 4px;
      max-width: 640px
    }

    .grid div {
      text-align: center;
      color: var(--mu);
      font-size: 13px;
      padding-top: 8px
    }

    .grid button {
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--bd);
      background: #0d1022;
      cursor: pointer
    }

    .grid button.on {
      background: linear-gradient(135deg, var(--v), var(--b));
      border: 0
    }

    .chat {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 14px;
      height: 62vh
    }

    .chat .ls {
      overflow: auto
    }

    .ci {
      display: flex;
      gap: 10px;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      align-items: center
    }

    .ci:hover,
    .ci.act {
      background: var(--p2)
    }

    .ms {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 6px
    }

    .bu {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 14px;
      background: var(--p2)
    }

    .bu.me {
      align-self: flex-end;
      background: var(--v)
    }

    .mod {
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 12, .75);
      display: grid;
      place-items: center;
      z-index: 50;
      padding: 16px
    }

    .mod .card {
      max-width: 480px;
      width: 100%;
      max-height: 90vh;
      overflow: auto;
      background: var(--p)
    }

    #toast {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: var(--p2);
      border: 1px solid var(--v);
      padding: 10px 18px;
      border-radius: 12px;
      z-index: 99;
      display: none
    }

    .mt {
      display: none
    }

    @media(max-width:820px) {

      .hero,
      .g3,
      .g2,
      .chat {
        grid-template-columns: 1fr
      }

      .chat {
        height: auto
      }

      .chat .ls {
        max-height: 160px
      }

      nav.top .l {
        display: none
      }

      .shell {
        grid-template-columns: 1fr
      }

      aside {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        top: auto;
        height: auto;
        display: flex;
        z-index: 30;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid var(--bd);
        border-right: 0;
        overflow-x: auto
      }

      aside a {
        flex-direction: column;
        align-items: center;
        font-size: 11px;
        padding: 6px 10px;
        white-space: nowrap
      }

      aside .logo,
      aside .mt0 {
        display: none
      }

      main {
        padding: 18px 16px 90px
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="toast" role="status"></div>
  <script>
    const G = ["Valorant", "League of Legends", "Apex Legends", "Minecraft", "Fortnite", "Elden Ring", "Overwatch 2", "Rocket League", "Helldivers 2", "Stardew Valley", "Counter-Strike 2", "Genshin Impact", "Roblox", "The Sims 4", "PUBG: Battlegrounds", "Warframe", "Sea of Thieves", "Baldur’s Gate 3", "Palworld", "Among Us", "Fall Guys", "Dota 2", "Teamfight Tactics", "Phasmophobia", "The Forest"], PL = ["PC", "PlayStation", "Xbox", "Nintendo Switch", "Steam Deck", "Móvil"], ST = ["Casual", "Competitivo", "Tryhard", "Cooperativo", "Exploración", "Supervivencia", "Roleplay"], LV = ["Principiante", "Intermedio", "Avanzado", "Élite"], LG = ["Español", "English", "Português", "Français"], CO = ["España", "México", "Argentina", "Portugal", "Francia", "Reino Unido"], DY = ["L", "M", "X", "J", "V", "S", "D"], BL = ["Mañana", "Tarde", "Noche", "Madrugada"];
    const LANG_LABEL = { English: "Inglés", Português: "Portugués", Français: "Francés" }, STYLE_LABEL = { Tryhard: "Competitivo intenso", Roleplay: "Juego de rol" }, languageLabel = x => LANG_LABEL[x] || x, styleLabel = x => STYLE_LABEL[x] || x;
    const platforms = p => (Array.isArray(p.pl) ? p.pl : [p.pl]).map(x => x === "Nintendo" ? "Nintendo Switch" : x);
    const sl = s => s.split(" ");
    const DEMO = [
      { id: 1, n: "NovaRift", age: "22-25", c: "España", pl: "PC", g: ["Valorant", "Apex Legends", "Overwatch 2"], st: "Competitivo", lv: "Avanzado", lg: ["Español", "English"], av: sl("0-2 1-2 2-2 3-2 4-2 5-1"), likes: 1 },
      { id: 2, n: "PixelMaru", age: "18-21", c: "México", pl: "PC", g: ["Minecraft", "Stardew Valley", "Fortnite"], st: "Casual", lv: "Intermedio", lg: ["Español"], av: sl("5-0 5-1 6-0 6-1 2-1 3-2"), likes: 1 },
      { id: 3, n: "KaiOnSteam", age: "26-30", c: "Reino Unido", pl: "PC", g: ["Elden Ring", "Helldivers 2", "Counter-Strike 2"], st: "Cooperativo", lv: "Avanzado", lg: ["English"], av: sl("0-2 1-2 4-2 5-2 6-1") },
      { id: 4, n: "LunaByte", age: "22-25", c: "España", pl: "PlayStation", g: ["Fortnite", "Rocket League", "Apex Legends"], st: "Tryhard", lv: "Élite", lg: ["Español", "English"], av: sl("1-2 2-2 3-3 4-2 5-2"), likes: 1 },
      { id: 5, n: "ZeroLag", age: "18-21", c: "Argentina", pl: "Xbox", g: ["Rocket League", "Overwatch 2", "Valorant"], st: "Competitivo", lv: "Intermedio", lg: ["Español"], av: sl("0-1 1-1 2-2 3-2 6-2") },
      { id: 6, n: "Mireia_Q", age: "31-35", c: "España", pl: "Nintendo", g: ["Stardew Valley", "Minecraft", "Genshin Impact"], st: "Exploración", lv: "Principiante", lg: ["Español", "Français"], av: sl("5-0 6-0 6-1 2-2") },
      { id: 7, n: "Tiago.exe", age: "22-25", c: "Portugal", pl: "PC", g: ["League of Legends", "Valorant", "Counter-Strike 2"], st: "Tryhard", lv: "Élite", lg: ["Português", "English", "Español"], av: sl("0-2 1-2 2-2 3-2 4-3") },
      { id: 8, n: "AuroraRPG", age: "26-30", c: "Francia", pl: "PC", g: ["Elden Ring", "Genshin Impact", "Minecraft"], st: "Roleplay", lv: "Intermedio", lg: ["Français", "English"], av: sl("2-2 4-2 5-1 5-2 6-1") }];
    const KEY = "t2p_v1";
    let S = { users: [], sess: null, me: null, av: [], tz: "Europe/Madrid", likes: [], pass: [], favs: [], match: [], msgs: {}, w: { games: 35, time: 25, style: 15, platform: 15, lang: 10 }, read: [] };
    try { const x = localStorage.getItem(KEY); if (x) S = { ...S, ...JSON.parse(x) } } catch (e) { }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) { } };
    const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    let tt; const toast = m => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(tt); tt = setTimeout(() => t.style.display = "none", 2600) };
    const ini = n => esc(n.slice(0, 2).toUpperCase()), hue = id => (id * 47 + 210) % 360;
    const avt = (p, on) => `<div class="av ${on ? "on" : ""}" style="--h:${hue(p.id)}">${ini(p.n)}</div>`;
    const chips = a => a.map(x => `<span class="chip">${esc(x)}</span>`).join("");
    // Compatibilidad: suma ponderada de 5 criterios (0..1) × pesos configurables en Ajustes
    const SYN = { Casual: ["Cooperativo", "Exploración"], Competitivo: ["Tryhard"], Tryhard: ["Competitivo"], Cooperativo: ["Casual", "Supervivencia", "Roleplay"], Exploración: ["Casual", "Roleplay"], Supervivencia: ["Cooperativo"], Roleplay: ["Exploración", "Cooperativo"] };
    function compat(p) {
      const m = S.me; if (!m) return { t: 0, parts: [] };
      const sg = p.g.filter(x => m.g.includes(x)), sh = p.av.filter(x => S.av.includes(x));
      const f = { games: sg.length / Math.max(1, Math.min(m.g.length, p.g.length)), time: sh.length / Math.max(1, Math.min(S.av.length, p.av.length)), style: m.st === p.st ? 1 : (SYN[m.st] || []).includes(p.st) ? .5 : 0, platform: platforms(m).some(x => platforms(p).includes(x)) ? 1 : 0, lang: p.lg.some(x => m.lg.includes(x)) ? 1 : 0 };
      const tot = Object.values(S.w).reduce((a, b) => a + b, 0) || 1, L = { games: "Juegos compartidos", time: "Horarios en común", style: "Estilo de juego", platform: "Plataforma", lang: "Idiomas" };
      const parts = Object.keys(f).map(k => ({ k: L[k], v: f[k], w: S.w[k] }));
      return { t: Math.round(parts.reduce((a, x) => a + x.v * x.w, 0) / tot * 100), parts, sg, sh }
    }
    const slot = s => { const [d, b] = s.split("-"); return DY[d] + " · " + BL[b] };
    function nav(h) { location.hash = h }
    const priv = ["dashboard", "find", "matches", "messages", "profile", "games", "availability", "settings"];
    function render() {
      let h = location.hash.slice(1) || "inicio";
      if (priv.includes(h)) { if (!S.sess) { h = "login" } else if (!S.me) { h = "perfil-setup" } }
      if (h === "perfil-setup" && !S.sess) h = "login";
      const A = $("#app"); window.scrollTo(0, 0);
      if (h === "inicio") A.innerHTML = landing(); else if (h === "login" || h === "registro" || h === "recuperar") A.innerHTML = authV(h);
      else if (h === "perfil-setup") A.innerHTML = `<div class="w" style="max-width:640px;padding-top:30px"><div class="logo lg"><i></i>TIME2PLAY</div><h2 style="margin:20px 0 4px">Crea tu perfil gamer</h2><p class="mu">Con esto calculamos tu compatibilidad con otros jugadores.</p>${pform("Guardar y entrar")}</div>`;
      else {
        const V = { dashboard, find, matches, messages, profile: () => `<h2>Mi perfil</h2><div class="card" style="max-width:640px">${pform("Guardar cambios")}</div>`, games, availability, settings }[h] || dashboard;
        A.innerHTML = `<div class="shell">${side(h)}<main>${V()}</main></div>`
      }
      if (h === "messages") scrollMs();
    }
    window.addEventListener("hashchange", render);
    function nb() { return `<nav class="top"><div class="w"><a href="#inicio" class="logo lg"><i></i>TIME2PLAY</a><div class="l"><a data-sc="top">Inicio</a><a data-sc="how">Cómo funciona</a><a data-sc="feat">Características</a><a data-sc="com">Comunidad</a></div><a class="btn sm" href="#login">Iniciar sesión</a><a class="btn sm pr" href="#registro">Registrarse</a></div></nav>` }
    function landing() {
      const bar = (a, m) => `<div class="bar">${Array.from({ length: 14 }, (_, i) => `<b class="${m.includes(i) ? "m" : a.includes(i) ? (a === A1 ? "a" : "z") : ""}"></b>`).join("")}</div>`;
      const A1 = [1, 2, 3, 4, 5, 9, 10, 11, 12], A2 = [4, 5, 6, 7, 8, 9, 10, 11]; const M = [4, 5, 9, 10, 11];
      const feats = [["Búsqueda inteligente de jugadores", "Consulta un porcentaje de compatibilidad calculado con criterios transparentes."], ["Compatibilidad horaria", "Comparamos tu calendario con el de otros jugadores y te mostramos los horarios en común."], ["Perfiles personalizados", "Añade un avatar, una portada, tu estilo de juego, tus idiomas y lo que buscas en un compañero."], ["Biblioteca de videojuegos", "Elige varios juegos y géneros. Priorizamos los que tenéis en común."], ["Sistema de amistades", "Añade a las personas compatibles y organiza tu equipo."], ["Mensajería privada", "Chats individuales con indicador de conexión, listos para funcionar en tiempo real."]];

      }
      else if (f.id === "pf") {
        const n = $("#pn").value.trim(), g = [...f.querySelectorAll('[data-set="g"] .on')].map(x => x.dataset.t), lg = [...f.querySelectorAll('[data-set="lg"] .on')].map(x => x.dataset.t), pl = [...f.querySelectorAll('[data-set="pl"] .on')].map(x => x.dataset.t);
        if (n.length < 3) return er.textContent = "El nombre de usuario necesita al menos 3 caracteres."; if (!g.length) return er.textContent = "Elige al menos un juego."; if (!lg.length) return er.textContent = "Elige al menos un idioma."; if (!pl.length) return er.textContent = "Elige al menos una plataforma.";
        const first = !S.me; S.me = { n, bio: $("#pb").value, age: $("#pa").value, c: $("#pc").value, pl, st: $("#ps").value, lv: $("#pv").value, g, lg }; save(); toast("Perfil guardado"); if (first) nav("availability"); else render()
      }
      else if (f.id === "cf") {
        const t = $("#ct").value.trim(); if (!t) return; (S.msgs[CH] = S.msgs[CH] || []).push({ me: 1, t }); const id = CH; save(); render();
        setTimeout(() => { (S.msgs[id] = S.msgs[id] || []).push({ t: "¡Genial! Miro mi calendario y te digo." }); save(); if (CH === id && location.hash === "#messages") render() }, 1200)
      }
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelector(".mod")?.remove() });
    render();
  </script>
</body>
